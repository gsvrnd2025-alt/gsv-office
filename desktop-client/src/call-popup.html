<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Incoming Call</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    .popup-container {
      background: rgba(18, 25, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 74px;
      box-sizing: border-box;
      backdrop-filter: blur(16px);
      -webkit-app-region: drag; /* make it draggable */
      gap: 12px;
    }
    .caller-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #25d366, #075e54);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.3);
      flex-shrink: 0;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
    .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .name {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .type {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      margin: 2px 0 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
      color: white;
    }
    .btn:hover {
      transform: scale(1.08);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-reject {
      background: #ef4444;
      box-shadow: 0 3px 8px rgba(239, 68, 68, 0.25);
    }
    .btn-reject:hover {
      background: #dc2626;
    }
    .btn-accept {
      background: #22c55e;
      box-shadow: 0 3px 8px rgba(34, 197, 94, 0.25);
      animation: gentle-shake 2s infinite;
    }
    .btn-accept:hover {
      background: #16a34a;
    }
    
    @keyframes gentle-shake {
      0%, 90%, 100% { transform: scale(1); }
      92% { transform: scale(1.08) rotate(6deg); }
      94% { transform: scale(1.08) rotate(-6deg); }
      96% { transform: scale(1.08) rotate(4deg); }
      98% { transform: scale(1.08) rotate(-4deg); }
    }
    
    /* Style for text-based remote desktop buttons */
    .actions.remote-desktop {
      gap: 6px;
    }
    .actions.remote-desktop .btn {
      width: auto;
      height: 30px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      padding: 0 10px;
      animation: none; /* remove shake */
    }
    .actions.remote-desktop .btn-accept {
      background: #0ea5e9;
      box-shadow: 0 3px 8px rgba(14, 165, 233, 0.25);
    }
    .actions.remote-desktop .btn-accept:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="caller-info">
      <div class="avatar" id="avatar">?</div>
      <div class="details">
        <div class="name" id="callerName">Unknown</div>
        <div class="type" id="callType">Incoming Call...</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-reject" id="btnReject" title="Reject">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
      </button>
      <button class="btn btn-accept" id="btnAccept" title="Accept">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    let currentData = null;

    function handleIncomingData(data) {
      currentData = data;
      document.getElementById('callerName').textContent = data.callerName || 'Teammate';
      document.getElementById('avatar').textContent = (data.callerName || '?').charAt(0).toUpperCase();
      const actionsEl = document.querySelector('.actions');
      if (data.type === 'remote-desktop') {
        document.getElementById('callType').textContent = `Incoming Desktop Request...`;
        actionsEl.classList.add('remote-desktop');
        document.getElementById('btnAccept').innerHTML = `Accept`;
        document.getElementById('btnAccept').title = "Accept Request";
        document.getElementById('btnReject').innerHTML = `Reject`;
        document.getElementById('btnReject').title = "Reject Request";
        document.getElementById('avatar').style.background = "linear-gradient(135deg, #0ea5e9, #3b82f6)";
        document.getElementById('avatar').style.boxShadow = "0 0 10px rgba(14, 165, 233, 0.4)";
      } else {
        document.getElementById('callType').textContent = `Incoming ${data.type === 'video' ? 'Video' : 'Voice'} Call...`;
        actionsEl.classList.remove('remote-desktop');
        document.getElementById('btnAccept').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
        document.getElementById('btnAccept').title = "Accept Call";
        document.getElementById('btnReject').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>`;
        document.getElementById('btnReject').title = "Reject Call";
        document.getElementById('avatar').style.background = "linear-gradient(135deg, #25d366, #075e54)";
        document.getElementById('avatar').style.boxShadow = "0 0 10px rgba(37, 211, 102, 0.3)";
      }
    }

    ipcRenderer.on('call-data', (event, data) => {
      handleIncomingData(data);
    });

    ipcRenderer.on('popup-data', (event, data) => {
      if (data && data.payload) {
        handleIncomingData({ ...data.payload, type: data.type });
      }
    });

    document.getElementById('btnAccept').addEventListener('click', () => {
      const response = typeof currentData === 'object' && currentData ? { action: 'accept', type: currentData.type } : { action: 'accept', type: 'audio' };
      ipcRenderer.send('call-action-response', response);
      ipcRenderer.send('popup-action', { action: 'accept', type: response.type, payload: currentData });
    });

    document.getElementById('btnReject').addEventListener('click', () => {
      const response = typeof currentData === 'object' && currentData ? { action: 'reject', type: currentData.type } : { action: 'reject', type: 'audio' };
      ipcRenderer.send('call-action-response', response);
      ipcRenderer.send('popup-action', { action: 'reject', type: response.type, payload: currentData });
    });
  </script>
</body>
</html>
